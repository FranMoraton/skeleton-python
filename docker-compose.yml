services:
  python:
    build:
        context: .
        dockerfile: docker/python/Dockerfile
        target: development
    volumes:
        - .:/app
    ports:
        - "9000:9000"
    networks:
        - app-network
    develop:
      watch:
        - action: rebuild
          path: ./pyproject.toml


networks:
  app-network:
    driver: bridge
  