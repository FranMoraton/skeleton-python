[project]
name = "skeleton-python"
version = "0.1.0"
description = "base project for python projects"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.12",
]

[dependency-groups]
dev = [
    "ruff>=0.11.5",
    "black>=23.3.0",
    "mypy>=1.2.0",
    "pytest>=7.3.0",
    "pytest-asyncio>=0.21.0",
]
